<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Détails du feedback</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="container mt-4">
<h2>Détails du feedback</h2>

<ul class="list-group">
  <li class="list-group-item"><strong>ID :</strong> <span th:text="${feedback.id}"></span></li>
  <li class="list-group-item"><strong>Note :</strong> <span th:text="${feedback.note}"></span></li>
  <li class="list-group-item"><strong>Commentaire :</strong> <span th:text="${feedback.commentaire}"></span></li>
  <li class="list-group-item"><strong>Date :</strong> <span th:text="${feedback.date}"></span></li>
  <li class="list-group-item"><strong>Candidature ID :</strong> <span th:text="${feedback.candidature.id}"></span></li>
</ul>

<a th:href="@{/feedbacks}" class="btn btn-secondary mt-3">Retour</a>
</body>
</html>
