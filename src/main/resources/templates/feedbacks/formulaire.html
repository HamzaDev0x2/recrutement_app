<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ajouter un feedback</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="container mt-4">
<h2>Ajouter un feedback</h2>

<form th:action="@{/feedbacks/ajouter}" th:object="${feedback}" method="post">
    <div class="mb-3">
        <label class="form-label">Note :</label>
        <input type="number" th:field="*{note}" min="1" max="10" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label class="form-label">Commentaire :</label>
        <textarea th:field="*{commentaire}" class="form-control" required></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Date :</label>
        <input type="date" th:field="*{date}" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label class="form-label">Candidature :</label>
        <select th:field="*{candidature}" class="form-select" required>
            <option th:each="c : ${candidatures}" th:value="${c.id}"
                    th:text="${c.candidat.nom + ' - ' + c.offreEmploi.titre}"></option>

        </select>
    </div>

    <button type="submit" class="btn btn-success">Enregistrer</button>
    <a th:href="@{/feedbacks}" class="btn btn-secondary">Annuler</a>
</form>
</body>
</html>
